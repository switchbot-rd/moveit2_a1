# 双臂单瓶 A→B→C；加 --round-trip 回程。启动时加载 environment.dual_desktop.yaml。
# 位置是 world 坐标系中的瓶身中心，单位 m。先预览，再按位置摆放实物。
frame: world
arm: right
pick_position: [0.62, -0.14355402976044881, -0.26]
# B 点瓶底比深色底板高 2 mm，避免放置时压入支撑面。
place_position: [0.455, 0.0, -0.248]
# C 点沿用固定位置抓放预设，位于深色底板左侧。
c_position: [0.515, 0.22, -0.2525]
pick_support: onero_env_table
place_support: onero_env_dark_plate
diameter: 0.04
# 瓶身 16 cm，另有 2 cm 瓶颈，总高 18 cm。
bottle_height: 0.16

# Link7 的参考侧夹朝向：[roll, pitch, yaw]，单位 rad。
# MTC 会绕水瓶采样其他抓取方向；tcp_offset 为标定后的夹持中心偏移。
grasp_rpy: [2.2179678116524157, 1.4835488028900694, 2.321477392904749]
grasp_height: 0.04
# 每个取料点最多尝试的抓取方向数，按自然构型由近到远排序；越小规划越快。
grasp_limit: 24
# 右臂在 A 点抓取时沿 world +X 前移 1 cm；只修正抓取目标，不改 A 点瓶位。
right_a_grasp_offset: [0.010, 0.0, 0.0]
# 左臂在 B 点的夹取补偿，world [X, Y, Z]，单位 m；与 fixed_pick_place 预设一致，null 关闭。
left_b_grasp_offset: [0.0149, -0.0166, 0.020]
# 右臂在 B 点的放置补偿，world [X, Y, Z]，单位 m：从立柱前看向左 2 cm、向前 1 cm；null 关闭。
right_b_place_offset: [0.01, 0.02, 0.0]
# 左臂在 C 点的放置补偿，world [X, Y, Z]，单位 m：从立柱前看向右 1 cm、向后 1 cm；null 关闭。
left_c_place_offset: [-0.01, -0.01, 0.0]
# 左臂 C 点抓放高度校准，单位 m；负值下移，0 关闭；模拟模式不使用。
left_c_height_offset: -0.035
tcp_offset: null
open_opening: 1.0
grasp_opening: null

# 接近方向使用 world 坐标；距离和高度单位 m。
approach_direction: [0.9930832899642754, 0.10500179194461917, 0.0]
approach_distance: 0.05
lift_distance: 0.06
transfer_height: -0.14
# 松爪后的最小退开距离：B 点先直线后退再让位，其他放置点向上撤离。
retreat_distance: 0.06
# 接近、夹取和搬运时的手臂刚度；松爪或未持物退出后恢复原值。
carry_kp: 120.0
# 每段手臂轨迹重定时的 jerk 上限，rad/s³，范围 [1, 10000]。
# 越小通常越柔和、耗时越长；手臂速度和加速度仍由命令行缩放参数控制。
# 仅在 --smoothing ruckig 时生效；默认 --smoothing none 关闭额外平滑。
smoothing_jerk: 1000.0
position_tolerance: 0.015
# 松爪前，模型瓶底到支撑面的高度误差门限，单位 m，范围 (0, 0.01]。
placement_height_tolerance: 0.008
orientation_tolerance: 0.1
# 手腕轴向转动上限 45°，零空间目标优先少扭转；抓取/放置 joint-6 弯折最多 20°。
# 抬升和高位过渡允许 joint-6 弯曲。
# 肩部旋转最多 60°，joint-2 俯仰最多 30°，joint-3 参与自然构型择优。
max_wrist_roll_deviation: 0.7853981633974483
max_wrist_bend_deviation: 0.3490658503988659
max_arm_swivel_deviation: 1.0471975511965976
max_arm_pitch_deviation: 0.5235987755982988
