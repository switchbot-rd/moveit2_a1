# 双臂接力的右臂基准预设：A/B 点位于桌面中部，按手臂可达余量重新标定。
# 直接运行 fixed_pick_place 即可预览，添加 --execute 执行；无需先运行联合任务或编辑本文件。
# 坐标适用于当前 environment.dual_desktop.yaml 的桌面布局；其他现场可通过 --config 使用自定义文件。
# 双臂接力：默认右 A→B、左 B→C；加 --round-trip 才继续左 C→B、右 B→A。C 自动镜像 A。
# 先不带 --execute 预览；速度和加速度可在执行时另行设置。

# 参考系：目前只支持 world，位置、抓取朝向和接近方向均以此为准。
frame: world
# 配置基准手臂：双臂接力保留 right；左臂坐标与参考朝向由程序生成。
arm: right

# 取放位置与物体尺寸
# A 在桌面上（顶面 -0.340 m，中心 -0.250 m）；B、C 在深色底板上（顶面 -0.330 m，中心 -0.240 m）。

# 取料点 A 在桌面上；瓶身中心 Z = -0.340 + 0.180 / 2 = -0.250 m。
# 旧值 0.636 使肩到 Link7 达到最大伸展的约 96%，接近奇异；收到 0.59 后约 88%。
pick_position: [0.59, -0.14355402976044881, -0.25]
# 放料点 B 在深色板/托盘上；瓶身中心 Z = -0.330 + 0.180 / 2 = -0.240 m。
# Y=0 位于立柱及双臂中线；与 A 点、镜像 C 点的水平距离均约 0.197 m。
# 须与 A 点不同，瓶底也要落在支撑面上。
place_position: [0.455, 0.0, -0.24]
# 接力 C 点：深色底板左上角内侧（从立柱向前看，+X 前、+Y 左）。
# 底板前缘 x=0.545、左缘 y=0.25；瓶中心内缩 3 cm 到 x=0.515、y=0.22，支撑面为深色底板。
c_position: [0.515, 0.22, -0.2525]
# 实测 C 点实物比 FK 高约 2 cm：目标 Z 下压 2 cm，模型支撑面同步下压。
c_support_height_offset: -0.0125
# C 的 FK 与实物存在固定偏差；判定时单独放宽，避免已经接近落板仍报失败。
c_position_tolerance: 0.020
c_placement_height_tolerance: 0.020
# A 点支撑面的场景对象 ID：桌面。须已加载；填 null 时自动查找当前位置下方的桌面或底板。
pick_support: onero_env_table
# B/C 点支撑面的场景对象 ID：深色底板/托盘底面；托盘底面高度不同时改这里。
place_support: onero_env_dark_plate
# 瓶身直径，单位 m，须大于 0；用于建立碰撞模型和计算预期夹取开度。
diameter: 0.04
# 瓶身高度，单位 m，须大于 0；不含瓶颈，模型会额外增加 0.02 m 高的瓶颈。
bottle_height: 0.18

# 抓取姿态与夹爪开度

# Link7 法兰的参考朝向：[roll, pitch, yaw]，固定轴 XYZ 欧拉角，单位 rad。
# 作为夹取瓶身的参考；持物全程瓶身直立，允许绕 world Z 转向；空手撤离可自由调整朝向。
# null 表示尚未设置；须手动填写或用 --record-orientation 记录后，才能预览和执行。
grasp_rpy: [2.2179678116524157, 1.4835488028900694, 2.321477392904749]
# 夹持中心相对瓶身中心的竖直偏移，单位 m；正值向上、负值向下。
# 抓取点须离瓶身上下边缘至少 0.025 m，即绝对值不超过 bottle_height / 2 - 0.025。
grasp_height: 0.04
# 左臂在 B 点交接夹取时的夹持中心修正，world [X, Y, Z]，单位 m。
# 从立柱后向前看实物夹取点偏左约 1–2 cm，沿 -Y 修正 15 mm；
# 左 B 实测抓取偏低、偏浅：Z 抬高 20 mm，并沿接近方向加深 15 mm。
# 仅修正该次夹取目标，瓶子场景位置仍采用上一臂的放置反馈。
left_b_grasp_offset: [0.0149, -0.0166, 0.020]
# 左臂 C→B 放置 B 点的实测 X/Y 校正（world，m）；Z 交给 B 的 6 mm 高度容差。
left_b_place_offset: [-0.0212, -0.0183, 0.0]
# 右臂在 A 点抓取时沿 world +X 前移 1 cm；只修正抓取目标，不改 A 点瓶位。
right_a_grasp_offset: [0.010, 0.0, 0.0]
# 左臂 C→B 放置 B 时，模型支撑面同步下压，避免压入托盘后初始化失败。
b_support_height_offset: 0.0
# 左臂 C→B 在 C 点夹取时沿接近方向加深 1.5 cm，避免夹得太浅碰倒瓶子。
left_c_grasp_offset: [0.0149, -0.0016, 0.0]
# 夹取时夹持中心在 Link7 坐标系中的 [X, Y, Z] 偏移，单位 m。
# null 时按夹爪模型和夹取开度计算；实物标定后可填写测量值。
tcp_offset: null
# 抓取前和放下后的张开开度，范围 (0, 1]；1 为全开，须大于夹取开度。
open_opening: 1.0
# 预期接触物体时的开度；null 按瓶径和参考倾斜姿态计算，也可填写实物标定值。
# 手动值须大于 0 且小于 open_opening；真机仍需检测接触，不以到达该开度代替夹取确认。
grasp_opening: null

# 接近、搬运与撤离

# world 中指向水瓶的水平接近向量 [X, Y, Z]；Z 须为 0，X/Y 不能同时为 0。
# 程序自动归一化；[1, 0, 0] 表示沿 +X 接近，松爪后沿反方向撤离。
approach_direction: [0.9930832899642754, 0.10500179194461917, 0.0]
# 从预抓取位直线移动到抓取位的距离，单位 m，须大于 0。
approach_distance: 0.05
# 最小抬升距离，单位 m，须大于 0；B 点托盘有边框，抓取后至少抬升 6 cm。
# 同时限定取放点附近允许物体接触支撑面的高度范围。
lift_distance: 0.06
# 抓取后先抬升 6 cm，再保持直立到托盘正上方 10 cm 的中转高度（瓶身中心绝对 Z）。
# 到托盘正上方后再以最终瓶位的 5D 直立目标下降到托盘内。
# 须满足 transfer_height >= max(pick_position[2], place_position[2]) + lift_distance。
transfer_height: -0.14
# 短距离撤离时，沿接近方向反向及向上各退的距离，单位 m，须大于 0。
# 允许自由调整法兰朝向；B 点交接时先退离瓶子，再到自动规划的让位姿态。
retreat_distance: 0.06

# 增益、误差检查与结束姿态

# 持物时的手臂位置增益 kp，范围 (0, 500]；夹取确认后切换，松爪后恢复执行前值。
# 持物中止时保留当前增益；本任务不设置负载补偿。
carry_kp: 120.0
# 短距离接近的朝向偏差及持物全程瓶身倾斜限值，单位 rad，范围 (0, 0.2]。
# 持物全程要求直立；允许瓶子绕 world Z 转向。
orientation_tolerance: 0.1
# 固定取放单独收紧的 J5/J7 滚转上限，单位 rad；共享默认 90°，本任务用 75°。
# 软评分还会优先选择腕部偏差接近 0.35 rad 以内的分支。
max_wrist_roll_deviation: 1.3089969389957472
# 放置前，模型 FK 计算的物体中心到 B 点的最大距离，单位 m，范围 (0, 0.02]。
# 默认允许 15 mm 的空间位置误差；与控制器自身的关节到位容差分别检查。
# 超出此误差时保持夹持，不松爪；该检查不能替代实物位置标定。
position_tolerance: 0.015
# 松爪前，模型瓶底到支撑面的独立高度误差门限，单位 m。
# 此条件与位置、倾斜条件同时满足，并要求动作结束后的新鲜反馈连续稳定；并非触碰传感器。
placement_height_tolerance: 0.003
# 往返结束后右臂的待机姿态：按 joint1..joint7 排列，单位 rad；null 停在撤离位置。
# B 点交接时自动向外让位；本项只用于最终 B→A 段，须可无碰撞到达。
ready_joints: null
