# 右臂桌面演示预设：A 点采用联合任务已有的同一位置坐标，B 点位于桌面中间区域。
# 直接运行 fixed_pick_place 即可预览，添加 --execute 执行；无需先运行联合任务或编辑本文件。
# 坐标适用于当前 environment.desktop.yaml 的桌面布局；其他现场可通过 --config 使用自定义文件。
# 默认执行 A→B 放下并退开，再 B→A 重新抓取放回；--one-way 仅单程。
# 先不带 --execute 预览；速度和加速度可在执行时另行设置。

# 参考系：目前只支持 world，位置、抓取朝向和接近方向均以此为准。
frame: world
# 使用哪只手臂：right 为右臂，left 为左臂，须与当前服务和 --arm 选择一致。
arm: right

# 取放位置与物体尺寸
# environment.desktop.yaml 的深色底板顶面为 -0.330 m，18 cm 瓶身中心为 -0.240 m。

# 取料点 A 的瓶身中心 [X, Y, Z]，单位 m；Z = 支撑面高度 + bottle_height / 2。
pick_position: [0.6364587348557591, -0.09355402976044881, -0.24]
# 放料点 B 的瓶身中心 [X, Y, Z]，单位 m；从机械臂后方向前看，已沿 +Y 左移 0.10 m。
# 与 A 点的水平距离约 0.265 m。
# 须与 A 点不同，瓶底也要落在支撑面上。
place_position: [0.455, 0.1, -0.24]
# A 点支撑面的场景对象 ID；须已加载，填 null 时自动查找当前位置下方的桌面或底板。
pick_support: onero_env_dark_plate
# B 点支撑面的场景对象 ID；可与 A 点不同，托盘等其他支撑面需显式填写其 ID。
place_support: onero_env_dark_plate
# 瓶身直径，单位 m，须大于 0；用于建立碰撞模型和计算预期夹取开度。
diameter: 0.05
# 瓶身高度，单位 m，须大于 0；不含瓶颈，模型会额外增加 0.02 m 高的瓶颈。
bottle_height: 0.18

# 抓取姿态与夹爪开度

# Link7 法兰的参考朝向：[roll, pitch, yaw]，固定轴 XYZ 欧拉角，单位 rad。
# 保留侧夹倾斜，允许绕 world Z 转动；前伸接近方向仍按 approach_direction，不随转角改变。
# null 表示尚未设置；须手动填写或用 --record-orientation 记录后，才能预览和执行。
grasp_rpy: [2.2179678116524157, 1.4835488028900694, 2.321477392904749]
# 夹持中心相对瓶身中心的竖直偏移，单位 m；正值向上、负值向下。
# 抓取点须离瓶身上下边缘至少 0.025 m，即绝对值不超过 bottle_height / 2 - 0.025。
grasp_height: 0.02
# 夹取时夹持中心在 Link7 坐标系中的 [X, Y, Z] 偏移，单位 m。
# null 时按夹爪模型和夹取开度计算；实物标定后可填写测量值。
tcp_offset: null
# 抓取前和放下后的张开开度，范围 (0, 1]；1 为全开，须大于夹取开度。
open_opening: 1.0
# 预期接触物体时的开度；null 按瓶径和参考倾斜姿态计算，也可填写实物标定值。
# 手动值须大于 0 且小于 open_opening；真机仍需检测接触，不以到达该开度代替夹取确认。
grasp_opening: null

# 接近、搬运与撤离

# world 中指向水瓶的水平接近向量 [X, Y, Z]；Z 须为 0，X/Y 不能同时为 0。
# 程序自动归一化；[1, 0, 0] 表示沿 +X 接近，松爪后沿反方向撤离。
approach_direction: [0.9930832899642754, 0.10500179194461917, 0.0]
# 从预抓取位直线移动到抓取位的距离，单位 m，须大于 0。
approach_distance: 0.05
# 最小抬升距离，单位 m，须大于 0；同时限定取放点附近允许物体接触支撑面的高度范围。
lift_distance: 0.03
# 搬运时瓶身中心的绝对 world Z，单位 m；不是相对抬升距离，也不是法兰高度。
# 须满足 transfer_height >= max(pick_position[2], place_position[2]) + lift_distance。
# 当前支撑面 Z=-0.330 m，瓶身半高 0.090 m；设为 -0.040 m 时，瓶底离支撑面 0.20 m。
# 抓取后先竖直抬升，再在此高度平移，到 B 点上方后下降；转角作小幅平滑过渡。
transfer_height: -0.04
# 松爪后沿接近方向的反方向水平撤离的距离，单位 m，须大于 0。
# 后退前先竖直升回搬运高度，且至少上抬此距离，以避开瓶身和支架；两段均使用直线路径。
retreat_distance: 0.03

# 增益、误差检查与结束姿态

# 持物时的手臂位置增益 kp，范围 (0, 500]；夹取确认后切换，松爪后恢复执行前值。
# 持物中止时保留当前增益；本任务不设置负载补偿。
carry_kp: 120.0
# 接近段起点朝向偏差、搬运和放置时物体倾斜的限值，单位 rad，范围 (0, 0.2]。
# 搬运和放置允许物体绕 world Z 转向，不将水平转角计入倾斜误差。
orientation_tolerance: 0.1
# 放置前，模型 FK 计算的物体中心到 B 点的最大距离，单位 m，范围 (0, 0.02]。
# 默认允许 15 mm 的空间位置误差；与控制器自身的关节到位容差分别检查。
# 超出此误差时保持夹持，不松爪；该检查不能替代实物位置标定。
position_tolerance: 0.015
# 完成放置并撤离后返回的待机姿态：所选臂按 joint1..joint7 排列的七个关节角，单位 rad。
# null 表示不额外回位，停在撤离位置；填写时须满足实际关节限位且可无碰撞到达。
ready_joints: null
