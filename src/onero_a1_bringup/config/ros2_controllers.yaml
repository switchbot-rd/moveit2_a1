# ros2_control 控制器配置 —— 由 controller_manager 读取
#
# 注意：这个文件与 moveit_controllers.yaml 是【两个不同的东西】
#   * 本文件      -> 给 controller_manager 节点读（控制器类型、关节、接口）
#   * moveit_controllers.yaml -> 给 move_group 节点读（action 命名空间映射）

controller_manager:
  ros__parameters:
    # 更新频率。话题桥每个周期有跨进程通信开销，
    # 100Hz 稳妥；若实测抖动过大可降到 50Hz。
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


arm_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1-a1_r
      - joint2-a1_r
      - joint3-a1_r
      - joint4-a1_r
      - joint5-a1_r
      - joint6-a1_r
      - joint7-a1_r
    # Start from fresh measured state, never from the command interface's
    # initial value. In real-hardware mode the state starts as NaN and the
    # launch file waits for the joint-state broadcaster before activating JTC.
    set_last_command_interface_value_as_state_on_activation: false
    # Final point must stop: a nonzero velocity must not persist during hold.
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      # Optional arm_*_tolerance launch arguments uniformly override these
      # values. Omitted arguments preserve the per-joint settings below.
      # Require real feedback to converge; zero tolerances would disable these
      # checks and allow the controller to report success with a large error.
      goal_time: 1.0
      stopped_velocity_tolerance: 0.02
      joint1-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint2-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint3-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint4-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint5-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint6-a1_r:
        trajectory: 0.20
        goal: 0.1
      joint7-a1_r:
        trajectory: 0.20
        goal: 0.1
