# OMPL 规划管线配置
#
# 注意：本文件内容会被 MoveItConfigsBuilder.planning_pipelines() 包在
#      【管线名】下（此处为 ompl），最终参数路径为：
#          ompl.planning_plugins / ompl.arm.default_planner_config ...
#      若平铺加载，PlanningPipeline 会因 planning_plugins 为空而抛异常。
#
# planner_configs 故意不在此处声明 —— builder 会自动从
# moveit_configs_utils/default_configs/ompl_defaults.yaml 补齐
# （RRTConnect / RRTstar / PRM / EST / LBKPIECE / AnytimePathShortening 等）。

planning_plugins:
  - ompl_interface/OMPLPlanner

# RRTConnect 每次扩展的最大关节空间距离；0 使用 OMPL 自动值。
# 不改变碰撞检查间距、规划时限或执行速度。修改后重启服务。
rrtconnect_range: 0.5

# 请求适配器按顺序作用于每个规划请求
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision

# 响应适配器作用于规划结果；AddTimeOptimalParameterization 负责时间参数化
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath

# TOTG 可在生成速度曲线时改变关节空间路径。限制每个关节允许的偏移
# （转动关节单位 rad），减少近桌面路径在处理后发生碰撞的风险。
# 这不是末端精度或障碍物安全间距；最终仍由 ValidateSolution 检查碰撞。
totg:
  path_tolerance: 0.005

arm:
  # Keep orientation-constrained requests in joint space; the A1 KDL solver
  # otherwise struggles with pose-space interpolation near straight-arm poses.
  enforce_joint_model_state_space: true
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
    - RRTstar
    - PRM
    - EST
    - LBKPIECE
    - BiTRRT
    - AnytimePathShortening
  projection_evaluator: joints(joint1-a1_r,joint2-a1_r)
  # 更细地检查关节空间路径，适用于薄底板及夹爪手指等较小碰撞几何。
  longest_valid_segment_fraction: 0.001

gripper:
  enforce_joint_model_state_space: true
  default_planner_config: RRTConnect
  planner_configs: [RRTConnect]
