# 2026-10-16：用户实测的单臂桌面支架布局。
# 先用 allow_execution:=false 核对现场与 RViz；桌面足迹仍按与深色底板重合近似。
# 此文件只描述固定环境，不校准手臂运动学、关节零位或 SDK 重力模型。
example_only: false
mounting: humanoid_right
frame_id: world

# 米、弧度；xyz 是长方体中心。
# world 原点沿用当前机械臂根部 base_link；+X 朝夹爪伸出方向，+Z 朝上。
# A1R 根部向立柱外侧伸出（-Y），立柱在根部的 +Y 侧。
# 根部安装面外侧为 y=0；5 mm 连接板占据 y=[0, 0.005]。
# 立柱中心位于根部前方 80 mm、内侧 35 mm。
# 深色底板顶 z=-0.330；银色底座厚 5 mm；立柱本体净高 370 mm。
# 底板与底座的后边缘、立柱后表面均为 x=0.050。
# 深色底板按用户指定的 1 m × 1 m 近似，立柱横向居中。
# 木桌厚度沿用 30 mm；桌面水平位置暂与底板对齐，尚非独立测量值。
# 根部在连接板上距上边 40 mm、距前边 120 mm。
# 未包含对侧机械臂、夹爪、线缆和桌面其他物品。
objects:
  - id: onero_env_table
    size: [1.0, 1.0, 0.03]
    xyz: [0.55, 0.035, -0.355]  # 顶面 -0.340，承托 10 mm 深色底板
    color: [0.70, 0.53, 0.31, 1.0]

  # 底板 50×50 cm，前缘 x=0.545；B 在底板上，A/C 在前伸 20 cm 的桌面上。
  - id: onero_env_dark_plate
    size: [0.5, 0.5, 0.01]
    xyz: [0.295, 0.035, -0.335]  # 前缘 0.545，顶面 -0.330
    color: [0.22, 0.22, 0.22, 1.0]

  - id: onero_env_stand_foot
    size: [0.10, 0.15, 0.005]  # 100 mm 沿前后，150 mm 沿横向
    xyz: [0.10, 0.035, -0.3275]  # 后缘 0.050，顶面 -0.325
    color: [0.65, 0.67, 0.70, 1.0]

  - id: onero_env_column
    size: [0.06, 0.06, 0.37]
    xyz: [0.08, 0.035, -0.14]  # x=[0.050, 0.110]，z=[-0.325, 0.045]
    color: [0.55, 0.58, 0.62, 1.0]

  - id: onero_env_mount_plate
    size: [0.16, 0.005, 0.08]
    xyz: [0.04, 0.0025, 0.0]  # x=[-0.040, 0.120]，z=[-0.040, 0.040]
    color: [0.45, 0.48, 0.52, 1.0]
  # B 点托盘实测 18×18 cm、边框约 3 cm，放在深色底板上；
  # 实际托盘中心不在 B，拿到中心偏移后再把四个边框加入场景，
  # 否则按 B 居中建模会错误挡住 A→B 的自然路径。
  # B 点托盘：18 cm × 18 cm，边框高约 3 cm，底面落在深色底板上，按 B 居中摆放。
  - id: onero_env_b_tray_x_minus
    size: [0.008, 0.18, 0.03]
    xyz: [0.369, 0.0, -0.315]
    color: [0.52, 0.54, 0.57, 1.0]
  - id: onero_env_b_tray_x_plus
    size: [0.008, 0.18, 0.03]
    xyz: [0.541, 0.0, -0.315]
    color: [0.52, 0.54, 0.57, 1.0]
  - id: onero_env_b_tray_y_minus
    size: [0.18, 0.008, 0.03]
    xyz: [0.455, -0.086, -0.315]
    color: [0.52, 0.54, 0.57, 1.0]
  - id: onero_env_b_tray_y_plus
    size: [0.18, 0.008, 0.03]
    xyz: [0.455, 0.086, -0.315]
    color: [0.52, 0.54, 0.57, 1.0]
