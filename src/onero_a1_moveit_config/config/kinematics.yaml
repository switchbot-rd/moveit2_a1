# 逆运动学求解器配置
#
# 注意：本文件顶层是【组名】(arm)，MoveItConfigsBuilder.robot_description_kinematics()
#      会把它包在 robot_description_kinematics 下，最终参数路径为：
#          robot_description_kinematics.arm.kinematics_solver
#      若手工加载本文件而不加该前缀，MoveIt 会静默找不到 IK 插件。

arm:
  kinematics_solver: onero_a1_kinematics/NaturalPostureIK
  kinematics_solver_search_resolution: 0.005
  # 50 ms is too short for the iterative nullspace IK near the reach limit;
  # service requests already allow 100 ms per call.
  kinematics_solver_timeout: 0.1
